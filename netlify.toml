[build]
  command = "cd backend && npm install && cd ../frontend && npm install --include=dev && npm run build"
  publish = "frontend/dist"

[functions]
  directory = "backend/functions"
  node_bundler = "esbuild"

# Route all /api/* requests to the serverless Express function.
# Netlify preserves the original path so Express routes at /api/* match correctly.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback — must come AFTER the API redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
